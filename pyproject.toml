[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice2json"
version = "0.0.1"
description = "Fine-tuning a 0.5B open-weight model for reliable structured invoice extraction."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ismail Ferdi" }]
keywords = ["llm", "fine-tuning", "qlora", "invoice", "extraction", "json"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
    "jsonschema>=4.26.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
train = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.1.0",
    "mlflow>=3.17.0",
    "peft>=0.21.2",
    "torch>=2.14.1",
    "transformers>=5.19.0",
    "trl>=1.14.2",
]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]
serve = [
    "fastapi>=0.142.4",
    "gradio>=6.29.1",
    "prometheus-client>=0.26.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
invoice2json-train = "src.training.train_qlora:main"
invoice2json-eval = "src.evaluation.harness:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "gpu: marks tests requiring a GPU",
  "slow: marks slow tests",
  "integration: marks integration tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  'if __name__ == "__main__":',
]